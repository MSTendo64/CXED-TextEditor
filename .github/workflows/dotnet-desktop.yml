name: Build Desktop App

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            artifact_name: app-windows
          - os: ubuntu-latest
            rid: linux-x64
            artifact_name: app-linux
          - os: macos-latest
            rid: osx-x64
            artifact_name: app-macos

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'   # Укажите вашу версию .NET (6.0.x, 7.0.x, 8.0.x и т.д.)

    - name: Restore dependencies
      # Восстановление пакетов для всего решения
      run: dotnet restore

    - name: Build
      # Сборка решения без восстановления (уже сделано выше)
      run: dotnet build --no-restore --configuration Release

    - name: Test
      # Запуск тестов (если есть тестовые проекты в решении)
      run: dotnet test --no-build --configuration Release --verbosity normal

    - name: Publish
      # Публикация конкретного проекта из подпапки с указанием RID для целевой ОС
      # Замените "YourProjectFolder/YourApp.csproj" на реальный путь к вашему .csproj
      run: dotnet publish "CWTEd/cxed.csproj" -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -o ./publish/${{ matrix.rid }}

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: ./publish/${{ matrix.rid }}/
        retention-days: 7
